services:
  db:
    image: mysql:8.4
    container_name: cockpit-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cockpit
      MYSQL_USER: cockpit
      MYSQL_PASSWORD: cockpit
      MYSQL_ROOT_PASSWORD: cockpit
    ports:
      - "3320:3306"
    volumes:
      - cockpit_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcockpit"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: cockpit-adminer
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cockpit_db:
